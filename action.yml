name: Delete closed branch
description: >-
  Retarget the pull requests stacked on a closed pull request to the default
  branch, then delete the closed branch.
author: garaemon
branding:
  icon: git-branch
  color: gray-dark

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      with:
        script: |
          const { owner, repo } = context.repo;
          if (context.eventName !== 'pull_request' || context.payload.action !== 'closed') {
            core.info(`Skip: ${context.eventName} ${context.payload.action} is not a closed pull request.`);
            return;
          }

          const closedPull = context.payload.pull_request;
          // A fork's branch lives in another repository, which GITHUB_TOKEN
          // cannot write to. head.repo is null when the fork no longer exists.
          if (closedPull.head.repo?.full_name !== `${owner}/${repo}`) {
            core.info(`Skip: #${closedPull.number} comes from a fork.`);
            return;
          }

          const closedBranch = closedPull.head.ref;
          const defaultBranch = context.payload.repository.default_branch;
          if (closedBranch === defaultBranch) {
            core.info(`Skip: ${closedBranch} is the default branch.`);
            return;
          }

          // GitHub closes every open pull request whose base branch is
          // deleted, so the stacked pull requests move to the default
          // branch before the deletion.
          const stackedPulls = await github.paginate(github.rest.pulls.list, {
            owner,
            repo,
            state: 'open',
            base: closedBranch,
            per_page: 100,
          });
          for (const stackedPull of stackedPulls) {
            core.info(`Retarget #${stackedPull.number} from ${closedBranch} to ${defaultBranch}.`);
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: stackedPull.number,
              base: defaultBranch,
            });
          }

          try {
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${closedBranch}` });
            core.info(`Deleted ${closedBranch}.`);
          } catch (error) {
            // 422 means that someone already deleted the branch, for
            // example with the "Delete branch" button on the pull request.
            if (error.status !== 422) {
              throw error;
            }
            core.info(`Skip: ${closedBranch} no longer exists.`);
          }
