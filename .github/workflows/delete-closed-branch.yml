name: Delete closed branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-branch:
    runs-on: ubuntu-slim
    steps:
      # Check out the pull request's own head so that a change to action.yml
      # runs on its pull request before the next tag. The merge ref does not
      # exist for a pull request closed with conflicts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./
